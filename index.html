<script>
const SETS=[1,2,3,4,5];
let MG_DATABASE=null;
let QUESTIONS=[];
async function loadMGDatabase(){
  if(!window.supabaseClient) throw new Error('Supabase client is not configured.');
  // Performance: fetch questions and options in parallel. If embedded relations are
  // available, use one request; otherwise fall back to two parallel reads.
  let qRows=null,oRows=null;
  const embedded=await supabaseClient.from('mg_questions').select('*,mg_question_options(*)').order('question_number');
  if(!embedded.error && Array.isArray(embedded.data)){
    qRows=embedded.data;
    oRows=qRows.flatMap(r=>(r.mg_question_options||[]).map(o=>({...o,question_id:o.question_id||r.question_id})));
  }else{
    const [qRes,oRes]=await Promise.all([
      supabaseClient.from('mg_questions').select('*').order('question_number'),
      supabaseClient.from('mg_question_options').select('*').order('question_id').order('option_order')
    ]);
    if(qRes.error) throw new Error('Supabase questions load failed: '+qRes.error.message);
    if(oRes.error) throw new Error('Supabase options load failed: '+oRes.error.message);
    qRows=qRes.data; oRows=oRes.data;
  }
  if(!Array.isArray(qRows)||qRows.length!==125||!Array.isArray(oRows)||oRows.length!==500) throw new Error('Supabase MG 125 validation failed.');
  const optMap={};
  oRows.forEach(o=>{(optMap[o.question_id]??=[]).push(o)});
  const records=qRows.map(r=>{
    const opts=Object.fromEntries((optMap[r.question_id]||[]).map(o=>[String(o.option_letter).toLowerCase(),{text:o.option_text}]));
    return {question_id:r.question_id,set_id:r.set_id,subset_id:r.subset_id,subset_question_id:r.subset_question_id,subset_question_tag:r.subset_question_tag,question_tag:r.question_tag,set_range:r.set_range,exam_name:r.exam_name,exam_year:r.exam_year,exam_date:r.exam_date,shift:r.shift,question_text:r.question_text,options:opts,answer:{option_letter:r.answer_letter,text:r.answer_text},explanation:{text:r.explanation_text},figure_asset:r.figure_asset,math_rendering:r.math_rendering};
  });
  const seen=new Set(), buckets=new Set();
  records.forEach(r=>{if(!r.question_id||seen.has(r.question_id))throw new Error('Duplicate/invalid question_id in Supabase.');seen.add(r.question_id);if(r.set_id<1||r.set_id>5||!['A','B','C','D','E'].includes(r.subset_id))throw new Error('Invalid set/subset classification.');buckets.add(`S${String(r.set_id).padStart(2,'0')}-${r.subset_id}`)});
  if(buckets.size!==25)throw new Error('Supabase must contain all 25 Set+Subset buckets.');
  MG_DATABASE={total_questions:125,records};
  QUESTIONS=records.map((r,i)=>[r.question_text,['a','b','c','d'].map(k=>r.options[k]?.text??''),Math.max(0,['A','B','C','D'].indexOf(r.answer.option_letter||'')),r.explanation.text??'',r,i]);
  rebuildBucketMap();
}
async function ensureSupabaseSession(){
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(session) return session;
  const {data,error}=await supabaseClient.auth.signInAnonymously();
  if(error) throw new Error('Supabase anonymous sign-in failed: '+error.message);
  return data.session;
}
let profileSyncPromise=null;
async function registerSupabaseProfile(){
  if(profileSyncPromise) return profileSyncPromise;
  profileSyncPromise=(async()=>{
    await ensureSupabaseSession();
    const hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(S.pin));
    const pinHash=Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
    const {data,error}=await supabaseClient.rpc('ssc_register_profile',{p_user_code:S.user,p_display_name:S.user,p_preferred_language:'English',p_pin_hash:pinHash});
    if(error) throw new Error('Profile sync failed: '+error.message);
    return data;
  })().catch(err=>{profileSyncPromise=null;throw err});
  return profileSyncPromise;
}
async function loadRemoteBookmarks(){
  const {data,error}=await supabaseClient.from('mg_bookmarks').select('question_id').order('updated_at',{ascending:false});
  if(error) throw new Error('Supabase bookmarks load failed: '+error.message);
  const idxById=Object.fromEntries(QUESTIONS.map((q,i)=>[q[4].question_id,i]));
  D.bookmarks=(data||[]).map(row=>{
    const q=idxById[row.question_id];
    const r=QUESTIONS[q]?.[4];
    return Number.isInteger(q)&&r?{set:r.set_id,q,question_id:row.question_id}:null;
  }).filter(Boolean);
  saveData();
}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","\'":"&#39;"}[m]));}
async function rpc(name,args){
  const {data,error}=await supabaseClient.rpc(name,args||{});
  if(error) throw error;
  return data;
}
async function createRemoteTest(){
  await registerSupabaseProfile();
  const mode='parent_set_full';
  const tid=await rpc('mg_create_test',{p_test_date:S.date,p_language:'English',p_generation_mode:mode,p_selected_set_id:S.set,p_attempt_stage:S.phase==='revision'?'revision_'+Math.min(3,Math.max(1,(rec(S.set).completed||1))):'first_attempt'});
  const {data,error}=await supabaseClient.from('mg_test_questions').select('position,question_id,is_marked_for_review,solving_time_seconds').eq('test_id',tid).order('position');
  if(error)throw error;
  if(!Array.isArray(data)||data.length!==25)throw new Error('Remote test generation failed.');
  const idxById=Object.fromEntries(QUESTIONS.map((q,i)=>[q[4].question_id,i]));
  S.testId=tid;S.pool=data.map(x=>idxById[x.question_id]);S.remoteQuestions=data;
  return tid;
}
async function syncAnswerRemote(){
  if(!S.testId||S.bookmarkMode)return;
  const letter=S.ans[S.q]===null?null:String.fromCharCode(65+S.ans[S.q]);
  try{await rpc('mg_set_answer',{p_test_id:S.testId,p_position:S.q+1,p_selected_option:letter})}catch(e){console.error(e)}
}
async function syncMarkRemote(marked){
  if(!S.testId||S.bookmarkMode)return;
  try{await rpc('mg_mark_review',{p_test_id:S.testId,p_position:S.q+1,p_marked:marked})}catch(e){console.error(e)}
}

const KEY="ssc_archives_account_v4";
const DATA_KEY="ssc_archives_data_mg125_v33";
const LAST_SOLUTION_KEY="ssc_archives_last_solution_v1";
const LAST_VIEW_KEY="ssc_archives_last_view_v1";
const $=id=>document.getElementById(id);
const blankArr=()=>Array(25).fill(null);
const blankBool=()=>Array(25).fill(false);
const blankState=()=>Array(25).fill("new");
const defaultData=()=>({attempts:{},bookmarks:[],sizeStep:0,testPools:{},pausedTest:null});
let D=loadData(), S={screen:"login",user:"",pin:"",set:1,q:0,ans:blankArr(),mark:blankBool(),date:"",seconds:900,deadline:0,phase:"first",bookmarkMode:false,bookmarkItems:[],state:blankState(),paletteVisible:true,autoSubmitting:false,submitBusy:false,pauseBusy:false,qTimes:blankArr().map(()=>0),qStartAt:0};
const isTouchDevice=()=>window.matchMedia("(pointer:coarse)").matches || navigator.maxTouchPoints>0;
function account(){try{return JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){return null}}
function saveAccount(){localStorage.setItem(KEY,JSON.stringify({user:S.user,pin:S.pin}))}
function loadData(){try{return Object.assign(defaultData(),JSON.parse(localStorage.getItem(DATA_KEY)||"{}"))}catch(e){return defaultData()}}
function saveData(){localStorage.setItem(DATA_KEY,JSON.stringify(D))}
function setKey(set){return "set"+set}
function rec(set){return D.attempts[setKey(set)]||{first:null,r1:null,r2:null,r3:null,r1_done:false,r2_done:false,r3_done:false,completed:0,lastScore:null,history:[]}}
function setRec(set,patch){D.attempts[setKey(set)]=Object.assign(rec(set),patch);saveData()}
const BUCKETS=Array.from({length:5},(_,s)=>['A','B','C','D','E'].map(sub=>`S${String(s+1).padStart(2,'0')}-${sub}`)).flat();
let BUCKET_MAP={};
function rebuildBucketMap(){
  BUCKET_MAP=Object.fromEntries(BUCKETS.map(b=>[b,QUESTIONS.map((q,i)=>q[4].subset_question_tag.startsWith(`SB-MG-${b}`)?i:null).filter(i=>i!==null)]));
  if(BUCKETS.some(b=>(BUCKET_MAP[b]||[]).length!==5)) throw new Error('Each Set+Subset bucket must contain exactly 5 questions.');
}
function shuffle(a){return a.slice().sort(()=>Math.random()-0.5)}
function validPool(pool){return Array.isArray(pool)&&pool.length===25&&new Set(pool).size===25&&BUCKETS.every(b=>pool.some(i=>{const r=QUESTIONS[i][4];return `S${String(r.set_id).padStart(2,'0')}-${r.subset_id}`===b}))}
function ensureTestPool(set){
  const key=setKey(set); D.testPools=D.testPools||{};
  if(validPool(D.testPools[key])) return D.testPools[key].slice();
  const used=new Set(Object.values(D.testPools).flat().filter(Number.isInteger));
  const chosen=[];
  for(const bucket of BUCKETS){
    const eligible=shuffle((BUCKET_MAP[bucket]||[]).filter(i=>!used.has(i)));
    if(!eligible.length) throw new Error(`No eligible question remains for ${bucket}`);
    chosen.push(eligible[0]); used.add(eligible[0]);
  }
  const pool=shuffle(chosen);
  if(!validPool(pool)) throw new Error('Generated test failed bucket/uniqueness validation.');
  D.testPools[key]=pool; saveData(); return pool.slice();
}
function resetTest(){S.q=0;S.ans=blankArr();S.mark=blankBool();S.state=blankState();S.qTimes=blankArr().map(()=>0);S.qStartAt=Date.now();S.paletteVisible=!isTouchDevice();S.seconds=900;S.deadline=0;S.autoSubmitting=false;S.pool=S.bookmarkMode?(S.bookmarkItems||[]).map(x=>x.q):[]}
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function sizePx(){return [16,18,20,22,24][D.sizeStep+2]}
function applySize(){document.documentElement.style.setProperty("--qsize",sizePx()+"px")}
function sizeButtons(){return `<div class="sizebar"><span class="small muted sizeLabel">Text</span><span class="desktopSizes">${[-2,-1,0,1,2].map(n=>`<button class="btn ${D.sizeStep===n?"active":""}" data-size="${n}">${n===0?"Current":n<0?"−"+Math.abs(n):"＋"+n}</button>`).join("")}</span><span class="mobileSizes"><button class="btn" data-size-dec aria-label="Decrease text size">−</button><button class="btn" data-size-inc aria-label="Increase text size">＋</button></span></div>`}
function bindSize(){document.querySelectorAll("[data-size]").forEach(b=>b.onclick=()=>{D.sizeStep=+b.dataset.size;saveData();applySize();render(S.screen==="test"?test():S.screen==="solutions"?solutions():home())});$("sizebar");document.querySelectorAll("[data-size-dec]").forEach(b=>b.onclick=()=>{D.sizeStep=Math.max(-2,D.sizeStep-1);saveData();applySize();render(S.screen==="test"?test():S.screen==="solutions"?solutions():home())});document.querySelectorAll("[data-size-inc]").forEach(b=>b.onclick=()=>{D.sizeStep=Math.min(2,D.sizeStep+1);saveData();applySize();render(S.screen==="test"?test():S.screen==="solutions"?solutions():home())})}
function authHeading(){return account()?"Welcome Back":"Welcome"}
function login(){
return `<main class="login"><section class="card glass auth">
<div class="tag">SSC ARCHIVES · MATHS (GEOMETRY)</div>
<h1>${authHeading()}</h1><p class="muted">${account()?"Login to continue your practice.":"Create your account to start your journey."}</p>

}
function notifications(){
let items=[];
SETS.forEach(set=>{let r=rec(set);["r1","r2","r3"].forEach((k,i)=>{if(r[k]&&!r[k+"_done"]){let due=new Date(r[k]+"T00:00:00"),today=new Date();today.setHours(0,0,0,0);let diff=Math.round((due-today)/86400000);if(diff<=0)items.push({set,k,idx:i+1,text:diff===0?`Your Maths (Geometry) — Set ${set} Revision ${i+1} is due today.`:`Your Maths (Geometry) — Set ${set} Revision ${i+1} is overdue.`})}})});
return items;
}
function home(){
let ns=notifications(), bcount=D.bookmarks.length;
return `<header class="top homeTop"><div class="topin"><div><div class="brand">SSC <span>Archives</span></div><div class="tag">MATHS · GEOMETRY</div></div><div class="homeNav"><button class="navbtn" data-home="notifications">🔔 <span>Notifications</span>${ns.length?`<i>${ns.length}</i>`:""}</button><button class="navbtn" data-home="progress">📊 <span>My Progress</span></button><button class="navbtn" data-home="leaderboard">🏆 <span>Leaderboard</span></button><button class="navbtn" data-home="revision">↻ <span>Revision</span></button><button class="navbtn" data-home="bookmarks">★ <span>Bookmarks</span></button><button class="navbtn" data-home="profile">◉ <span>Profile</span></button></div></div></header>
<main class="wrap">

</section>

${ns.length?`<section class="card glass noticeCard"><div class="row between"><div><h2>🔔 Due Notifications</h2><p class="small muted">Revision dates that need your attention</p></div><button class="btn warn" data-home="notifications">Open</button></div>${ns.slice(0,2).map(n=>`<div class="notif">🔔 <b>${n.text}</b><span class="small muted">Open Revision</span></div>`).join("")}</section>`:""}

function bindLeaderboardCarousel(){
  const carousel=document.querySelector("[data-leader-carousel]"),track=document.querySelector("[data-leader-track]");
  if(!carousel||!track)return;
  let idx=Math.max(0,Math.min(SETS.length-1,Number.isInteger(S.leaderboardSetIndex)?S.leaderboardSetIndex:0));
  let sx=0,sy=0,tracking=false;
  const paint=()=>{
    idx=Math.max(0,Math.min(SETS.length-1,idx));
    S.leaderboardSetIndex=idx;
    track.style.transform=`translate3d(-${idx*100}%,0,0)`;
    document.querySelectorAll("[data-leader-dot]").forEach((d,i)=>d.classList.toggle("active",i===idx));
    const prev=document.querySelector("[data-leader-prev]"),next=document.querySelector("[data-leader-next]");
    if(prev)prev.disabled=idx===0;
    if(next)next.disabled=idx===SETS.length-1;
  };
  const go=d=>{idx=Math.max(0,Math.min(SETS.length-1,idx+d));paint()};
  document.querySelector("[data-leader-prev]")?.addEventListener("click",e=>{e.preventDefault();go(-1)});
  document.querySelector("[data-leader-next]")?.addEventListener("click",e=>{e.preventDefault();go(1)});
  document.querySelectorAll("[data-leader-dot]").forEach(d=>d.addEventListener("click",e=>{e.preventDefault();idx=Number(d.dataset.leaderDot)||0;paint()}));

  /* One unified pointer handler: works on Android/tablet touch and laptop mouse.
     touch-action: pan-y keeps normal vertical page scrolling while allowing us
     to detect intentional horizontal swipes here. */
  carousel.style.touchAction="pan-y";
  carousel.addEventListener("pointerdown",e=>{
    if(e.pointerType!=="touch" && e.pointerType!=="pen")return;
    sx=e.clientX;sy=e.clientY;tracking=true;
    try{carousel.setPointerCapture(e.pointerId)}catch(_){ }
  },{passive:true});
  carousel.addEventListener("pointerup",e=>{
    if(!tracking)return;
    tracking=false;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    try{carousel.releasePointerCapture(e.pointerId)}catch(_){ }
    if(Math.abs(dx)>=40 && Math.abs(dx)>Math.abs(dy)*1.15){
      go(dx<0?1:-1);
    }
  },{passive:true});
  carousel.addEventListener("pointercancel",()=>{tracking=false},{passive:true});
  paint();
}

function solutionStatus(item){

  return {answered,correct,correctIndex};

function bindProgressCarousels(){
 document.querySelectorAll("[data-progress-carousel]").forEach(car=>{
  if(car.__progressBound)return;car.__progressBound=true;
  const slides=[...car.querySelectorAll("[data-progress-stage]")], dots=[...car.parentElement.querySelectorAll("[data-progress-dot]")], set=car.closest(".progressSetCard")?.querySelector("[data-progress-next]")?.dataset.progressNext;
  let idx=0,sx=0,sy=0,active=false;
  const paint=()=>{slides.forEach((x,i)=>x.classList.toggle("active",i===idx));dots.forEach((x,i)=>x.classList.toggle("active",i===idx));};
  car.closest(".progressSetCard")?.querySelector(`[data-progress-prev="${set}"]`)?.addEventListener("click",()=>{idx=Math.max(0,idx-1);paint()});
  car.closest(".progressSetCard")?.querySelector(`[data-progress-next="${set}"]`)?.addEventListener("click",()=>{idx=Math.min(slides.length-1,idx+1);paint()});
  car.addEventListener("touchstart",e=>{if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;active=true},{passive:true});
  car.addEventListener("touchend",e=>{if(!active||!e.changedTouches.length)return;active=false;let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.15)return;if(dx<0)idx=Math.min(slides.length-1,idx+1);else idx=Math.max(0,idx-1);paint()},{passive:true});
  paint();
 });
}
function bindHomeScroll(){
 if(window.__homeScrollHandler)window.removeEventListener("scroll",window.__homeScrollHandler);
 if(window.__homeTouchStart)window.removeEventListener("touchstart",window.__homeTouchStart);
 if(window.__homeTouchEnd)window.removeEventListener("touchend",window.__homeTouchEnd);
 window.__homeScrollHandler=null;window.__homeTouchStart=null;window.__homeTouchEnd=null;
 if(!isTouchDevice()||!window.matchMedia("(max-width:760px)").matches||S.screen!=="home")return;
 let lastY=Math.max(0,window.scrollY||document.documentElement.scrollTop||document.body.scrollTop||0);
 let ticking=false,touchStartY=lastY;
 const getY=()=>Math.max(0,window.scrollY||document.documentElement.scrollTop||document.body.scrollTop||0);
 const setNav=hidden=>{const nav=document.querySelector(".homeNav");if(nav)nav.classList.toggle("nav-hidden",hidden)};
 const update=()=>{
   ticking=false;
   const y=getY(),delta=y-lastY;
   if(y<=12){setNav(false);lastY=y;return}
   if(delta>8)setNav(true);
   else if(delta<-8)setNav(false);
   lastY=y;
 };
 window.__homeScrollHandler=()=>{if(!ticking){ticking=true;requestAnimationFrame(update)}};
 window.__homeTouchStart=e=>{touchStartY=e.touches[0]?.clientY||0};
 window.__homeTouchEnd=e=>{
   const t=e.changedTouches?.[0];if(!t)return;
   const dy=t.clientY-touchStartY,y=getY();
   if(y<=12){setNav(false);lastY=y;return}
   if(dy<-18)setNav(true);
   else if(dy>18)setNav(false);
   lastY=y;
 };
 window.addEventListener("scroll",window.__homeScrollHandler,{passive:true});
 window.addEventListener("touchstart",window.__homeTouchStart,{passive:true});
 window.addEventListener("touchend",window.__homeTouchEnd,{passive:true});
 setNav(getY()>12);
}

function bindSwipeNavigation(){
  if(!isTouchDevice()) return;
  const selectors = S.screen==="solutions" ? ".solutionScreen" : ".test .card";
  const area=document.querySelector(selectors);
  if(!area || area.__swipeBound) return;
  area.__swipeBound=true;
  let sx=0,sy=0,active=false;
  area.addEventListener("touchstart",e=>{
    if(e.touches.length!==1)return;
    sx=e.touches[0].clientX; sy=e.touches[0].clientY; active=true;
  },{passive:true});
  area.addEventListener("touchend",e=>{
    if(!active || !e.changedTouches.length)return;
    active=false;
    const dx=e.changedTouches[0].clientX-sx;
    const dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)<55 || Math.abs(dx)<Math.abs(dy)*1.2)return;
    if(S.screen==="solutions") {
      const total=S.bookmarkMode?S.bookmarkItems.length:25;
      if(dx<0 && S.q<total-1){S.q++;render(solutions())}
      else if(dx>0 && S.q>0){S.q--;render(solutions())}
    } else if(S.screen==="test") {
      const total=S.bookmarkMode?S.bookmarkItems.length:25;
      if(dx<0 && S.q<total-1)goToQuestion(S.q+1);
      else if(dx>0 && S.q>0)goToQuestion(S.q-1);
    }
  },{passive:true});
}
function bindTestSwipe(){bindSwipeNavigation()}

}

async function submitNow(auto=false){
  if(S.submitBusy)return;
  S.submitBusy=true;
  const submitBtns=[$("submit"),$("lastSubmit")].filter(Boolean);
  submitBtns.forEach(b=>{b.disabled=true;b.textContent="Submitting…"});
  recordQuestionTime();clearInterval(window.timer);D.pausedTest=null;saveData();
  if(S.testId&&!S.bookmarkMode){
    try{
      await rpc('mg_sync_question_state',{p_test_id:S.testId,p_position:S.q+1,p_solving_seconds:Math.ceil((S.qTimes[S.q]||0)/1000),p_current:true});
      const result=await rpc('mg_submit_test',{p_test_id:S.testId,p_elapsed_seconds:900-Math.max(0,S.seconds)});
      const correct=Number(result?.correct_count??0),attempted=Number(result?.attempted_count??0);
      let r=rec(S.set),completed=(r.completed||0)+1,history=Array.isArray(r.history)?r.history.slice():[];
      const phase=completed===1?'First Attempt':completed===2?'Revision 1':completed===3?'Revision 2':completed===4?'Revision 3':'Unknown';
      history.push({phase,date:S.date,score:correct,total:25,attempted,times:S.qTimes.slice(),question_ids:(S.pool||[]).map(i=>QUESTIONS[i][4].question_id),answers:S.ans.slice(),marked:S.mark.slice()});
      let patch={completed,lastScore:correct,first:r.first||S.date,history};if(completed===2)patch.r1_done=true;if(completed===3)patch.r2_done=true;if(completed>=4)patch.r3_done=true;setRec(S.set,patch);
      $('modal').innerHTML=resultModal();S.submitBusy=false;bind();return;
    }catch(e){console.error(e);S.submitBusy=false;submitBtns.forEach(b=>{b.disabled=false;b.textContent='Submit Test'});alert('Test submission failed: '+e.message);return;}
  }
  let r=rec(S.set),total=S.bookmarkMode?S.bookmarkItems.length:25;let correct=S.ans.reduce((n,a,i)=>{let qi=S.bookmarkMode?S.bookmarkItems[i].q:S.pool[i];return n+(a===QUESTIONS[qi][2]?1:0)},0);
  if(S.bookmarkMode){$('modal').innerHTML=`<div class="modal"><div class="modalbox glass"><h2>Bookmarked Test Submitted</h2><p class="muted">Score: ${correct}/${total}</p><button class="btn primary" id="homeAfterBookmark" style="width:100%">Back to Home</button></div></div>`;S.submitBusy=false;bind();return}
  S.submitBusy=false;
}

function startTimer(reset=true){
  clearInterval(window.timer);
  if(reset || !Number.isFinite(S.deadline) || S.deadline<=Date.now()){
    S.deadline=Date.now()+900000;
    S.seconds=900;
    S.lastTwoMinuteNotice=false;
  }else{
    S.seconds=Math.max(0,Math.ceil((S.deadline-Date.now())/1000));
  }
  const tick=()=>{
    let remaining=Math.max(0,S.deadline-Date.now());
    S.seconds=Math.ceil(remaining/1000);
    let e=$("timer");
    if(e){e.textContent=fmt(S.seconds);e.classList.toggle("low",S.seconds<=120)}
    // Persistence is handled by a lightweight 5-second heartbeat below;
    // do not serialize the full test state on every timer tick.
    if(remaining<=120000 && remaining>0 && !S.lastTwoMinuteNotice){
      S.lastTwoMinuteNotice=true;
      $("modal").innerHTML=`<div class="modal"><div class="modalbox glass"><h2>Last Two Minutes Remaining</h2><p class="muted">Please review your answers and submit the test before the timer reaches 00:00.</p><button class="btn primary" id="closeLastTwo" style="width:100%">Continue Test</button></div></div>`;
      $("closeLastTwo")?.addEventListener("click",()=>{$("modal").innerHTML=""});
    }
    if(remaining<=0){
      clearInterval(window.timer);
      if(!S.autoSubmitting){S.autoSubmitting=true;submitNow(true)}
    }
  };
  tick();
  window.timer=setInterval(tick,1000);
}

/* V45: smooth Android portrait/landscape changes without forcing orientation */
(function bindOrientationSmoothing(){
  if(!('matchMedia' in window)) return;
  const isAndroid=()=>/Android/i.test(navigator.userAgent||'');
  if(!isAndroid()) return;
  let timer=null;
  const smooth=()=>{
    document.body.classList.add('orientation-changing');
    clearTimeout(timer);
    timer=setTimeout(()=>document.body.classList.remove('orientation-changing'),260);
  };
  window.addEventListener('orientationchange',smooth,{passive:true});
  window.addEventListener('resize',()=>{
    clearTimeout(timer);
    timer=setTimeout(()=>{
      if(document.body.classList.contains('orientation-changing')) document.body.classList.remove('orientation-changing');
    },260);
  },{passive:true});
})();
