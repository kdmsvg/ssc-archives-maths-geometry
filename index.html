const BUCKETS=Array.from({length:5},(_,s)=>['A','B','C','D','E'].map(sub=>`S${String(s+1).padStart(2,'0')}-${sub}`)).flat();
let BUCKET_MAP={};
function rebuildBucketMap(){
  BUCKET_MAP=Object.fromEntries(BUCKETS.map(b=>[b,QUESTIONS.map((q,i)=>q[4].subset_question_tag.startsWith(`SB-MG-${b}`)?i:null).filter(i=>i!==null)]));
  if(BUCKETS.some(b=>(BUCKET_MAP[b]||[]).length!==5)) throw new Error('Each Set+Subset bucket must contain exactly 5 questions.');
}
function shuffle(a){return a.slice().sort(()=>Math.random()-0.5)}
function validPool(pool){return Array.isArray(pool)&&pool.length===25&&new Set(pool).size===25&&BUCKETS.every(b=>pool.some(i=>{const r=QUESTIONS[i][4];return `S${String(r.set_id).padStart(2,'0')}-${r.subset_id}`===b}))}
function ensureTestPool(set){
  const key=setKey(set); D.testPools=D.testPools||{};
  if(validPool(D.testPools[key])) return D.testPools[key].slice();
  const used=new Set(Object.values(D.testPools).flat().filter(Number.isInteger));
  const chosen=[];
  for(const bucket of BUCKETS){
    const eligible=shuffle((BUCKET_MAP[bucket]||[]).filter(i=>!used.has(i)));
    if(!eligible.length) throw new Error(`No eligible question remains for ${bucket}`);
    chosen.push(eligible[0]); used.add(eligible[0]);
  }
  const pool=shuffle(chosen);
  if(!validPool(pool)) throw new Error('Generated test failed bucket/uniqueness validation.');
  D.testPools[key]=pool; saveData(); return pool.slice();
}

function bindLeaderboardCarousel(){
  const carousel=document.querySelector('[data-leader-carousel]');
  const track=document.querySelector('[data-leader-track]');
  if(!carousel||!track)return;

  let idx=Math.max(0,Math.min(SETS.length-1,Number.isInteger(S.leaderboardSetIndex)?S.leaderboardSetIndex:0));
  let sx=0,sy=0,tracking=false,lastSwipe=0;

  const paint=()=>{
    idx=Math.max(0,Math.min(SETS.length-1,idx));
    S.leaderboardSetIndex=idx;
    track.style.transform=`translate3d(-${idx*100}%,0,0)`;
    carousel.dataset.leaderIndex=String(idx);
    carousel.querySelectorAll('[data-leader-dot]').forEach((d,i)=>d.classList.toggle('active',i===idx));
    const prev=carousel.parentElement?.querySelector('[data-leader-prev]');
    const next=carousel.parentElement?.querySelector('[data-leader-next]');
    if(prev)prev.disabled=idx===0;
    if(next)next.disabled=idx===SETS.length-1;
  };
  const go=(delta)=>{idx=Math.max(0,Math.min(SETS.length-1,idx+delta));paint()};
  const goTo=(n)=>{idx=Math.max(0,Math.min(SETS.length-1,n));paint()};

  // Expose one stable navigation API so buttons remain reliable after any render.
  window.__leaderboardGo=go;
  window.__leaderboardGoTo=goTo;

  carousel.parentElement?.querySelector('[data-leader-prev]')?.addEventListener('click',e=>{
    e.preventDefault();e.stopPropagation();go(-1);
  });
  carousel.parentElement?.querySelector('[data-leader-next]')?.addEventListener('click',e=>{
    e.preventDefault();e.stopPropagation();go(1);
  });
  carousel.parentElement?.querySelectorAll('[data-leader-dot]').forEach(d=>d.addEventListener('click',e=>{
    e.preventDefault();e.stopPropagation();goTo(Number(d.dataset.leaderDot)||0);
  }));

  // Touch: horizontal movement changes the Set; vertical movement remains page scroll.
  carousel.addEventListener('touchstart',e=>{
    if(e.touches.length!==1)return;
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;tracking=true;
  },{passive:true});
  carousel.addEventListener('touchend',e=>{
    if(!tracking||!e.changedTouches.length)return;
    tracking=false;
    const dx=e.changedTouches[0].clientX-sx;
    const dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)<40||Math.abs(dx)<=Math.abs(dy)*1.05)return;
    const now=Date.now();if(now-lastSwipe<250)return;lastSwipe=now;
    go(dx<0?1:-1);
  },{passive:true});

  // Pointer fallback for tablets/browsers exposing touch as PointerEvents.
  carousel.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='touch'&&e.pointerType!=='pen')return;
    sx=e.clientX;sy=e.clientY;tracking=true;
  },{passive:true});
  carousel.addEventListener('pointerup',e=>{
    if(!tracking||e.pointerType==='mouse')return;
    tracking=false;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)<40||Math.abs(dx)<=Math.abs(dy)*1.05)return;
    const now=Date.now();if(now-lastSwipe<250)return;lastSwipe=now;
    go(dx<0?1:-1);
  },{passive:true});
  carousel.addEventListener('pointercancel',()=>{tracking=false},{passive:true});

  paint();
}

function bindProgressCarousels(){
 document.querySelectorAll("[data-progress-carousel]").forEach(car=>{
  if(car.__progressBound)return;car.__progressBound=true;
  const slides=[...car.querySelectorAll("[data-progress-stage]")], dots=[...car.parentElement.querySelectorAll("[data-progress-dot]")], set=car.closest(".progressSetCard")?.querySelector("[data-progress-next]")?.dataset.progressNext;
  let idx=0,sx=0,sy=0,active=false;
  const paint=()=>{slides.forEach((x,i)=>x.classList.toggle("active",i===idx));dots.forEach((x,i)=>x.classList.toggle("active",i===idx));};
  car.closest(".progressSetCard")?.querySelector(`[data-progress-prev="${set}"]`)?.addEventListener("click",()=>{idx=Math.max(0,idx-1);paint()});
  car.closest(".progressSetCard")?.querySelector(`[data-progress-next="${set}"]`)?.addEventListener("click",()=>{idx=Math.min(slides.length-1,idx+1);paint()});
  car.addEventListener("touchstart",e=>{if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;active=true},{passive:true});
  car.addEventListener("touchend",e=>{if(!active||!e.changedTouches.length)return;active=false;let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.15)return;if(dx<0)idx=Math.min(slides.length-1,idx+1);else idx=Math.max(0,idx-1);paint()},{passive:true});
  paint();
 });
}
function bindHomeScroll(){
 if(window.__homeScrollHandler)window.removeEventListener("scroll",window.__homeScrollHandler);
 if(window.__homeTouchStart)window.removeEventListener("touchstart",window.__homeTouchStart);
 if(window.__homeTouchEnd)window.removeEventListener("touchend",window.__homeTouchEnd);
 window.__homeScrollHandler=null;window.__homeTouchStart=null;window.__homeTouchEnd=null;
 if(!isTouchDevice()||!window.matchMedia("(max-width:760px)").matches||S.screen!=="home")return;
 let lastY=Math.max(0,window.scrollY||document.documentElement.scrollTop||document.body.scrollTop||0);
 let ticking=false,touchStartY=lastY;
 const getY=()=>Math.max(0,window.scrollY||document.documentElement.scrollTop||document.body.scrollTop||0);
 const setNav=hidden=>{const nav=document.querySelector(".homeNav");if(nav)nav.classList.toggle("nav-hidden",hidden)};
 const update=()=>{
   ticking=false;
   const y=getY(),delta=y-lastY;
   if(y<=12){setNav(false);lastY=y;return}
   if(delta>8)setNav(true);
   else if(delta<-8)setNav(false);
   lastY=y;
 };
 window.__homeScrollHandler=()=>{if(!ticking){ticking=true;requestAnimationFrame(update)}};
 window.__homeTouchStart=e=>{touchStartY=e.touches[0]?.clientY||0};
 window.__homeTouchEnd=e=>{
   const t=e.changedTouches?.[0];if(!t)return;
   const dy=t.clientY-touchStartY,y=getY();
   if(y<=12){setNav(false);lastY=y;return}
   if(dy<-18)setNav(true);
   else if(dy>18)setNav(false);
   lastY=y;
 };
 window.addEventListener("scroll",window.__homeScrollHandler,{passive:true});
 window.addEventListener("touchstart",window.__homeTouchStart,{passive:true});
 window.addEventListener("touchend",window.__homeTouchEnd,{passive:true});
 setNav(getY()>12);
}

function bindSwipeNavigation(){

    if(!active || !e.changedTouches.length)return;

async function checkUserIdAvailability(){
  const input=$("uid"), box=$("uidAvailability");
  if(!input||!box||account()) return true;
  const u=input.value.trim().toUpperCase();
  const requestId=String(Date.now())+":"+u;
  input.dataset.availabilityRequest=requestId;
  if(!u){
    box.textContent="Live check: enter a User ID.";
    box.className="small uidAvailability checking";
    box.dataset.available="0";
    return false;
  }
  if(!/^[A-Za-z0-9_-]{4,30}$/.test(u)){
    box.textContent="Use 4–30 letters, numbers, _ or -.";
    box.className="small uidAvailability unavailable";
    box.dataset.available="0";
    return false;
  }
  box.textContent="Checking availability…";
  box.className="small uidAvailability checking";
  box.dataset.available="pending";
  try{
    const {data,error}=await supabaseClient.rpc("ssc_check_user_code_available",{p_user_code:u});
    if(input.dataset.availabilityRequest!==requestId) return false;
    if(error) throw error;
    const available=!!data;
    box.textContent=available?"✓ Available":"✕ Not available";
    box.className=available?"small uidAvailability available":"small uidAvailability unavailable";
    box.dataset.available=available?"1":"0";
    return available;
  }catch(e){
    if(input.dataset.availabilityRequest!==requestId) return false;
    console.error("User ID availability check failed:",e);
    box.textContent="Could not check availability. Try again.";
    box.className="small uidAvailability unavailable";
    box.dataset.available="0";
    return false;
  }
}

async function submitNow(auto=false){
  if(S.submitBusy)return;
  S.submitBusy=true;
  const submitBtns=[$("submit"),$("lastSubmit")].filter(Boolean);
  submitBtns.forEach(b=>{b.disabled=true;b.textContent="Submitting…"});
  recordQuestionTime();clearInterval(window.timer);D.pausedTest=null;saveData();
  if(S.testId&&!S.bookmarkMode){
    try{
      await rpcWithTimeout('mg_sync_question_state',{p_test_id:S.testId,p_position:S.q+1,p_solving_seconds:Math.ceil((S.qTimes[S.q]||0)/1000),p_current:true});
      const result=await rpcWithTimeout('mg_submit_test',{p_test_id:S.testId,p_elapsed_seconds:900-Math.max(0,S.seconds)});
      const correct=Number(result?.correct_count??0),attempted=Number(result?.attempted_count??0);
      let r=rec(S.set),completed=(r.completed||0)+1,history=Array.isArray(r.history)?r.history.slice():[];
      // Revision completion is persisted server-side after the revision test itself is submitted.
      // The RPC is idempotent, so a retry cannot create a duplicate completion.
      if(S.phase==='revision'){
        const revisionStage=completed===2?'revision_1':completed===3?'revision_2':completed===4?'revision_3':null;
        const revisionId=revisionStage?r[`r${completed-1}_id`]:null;
        if(revisionId){
          let completionSaved=false,lastCompletionError=null;
          for(let attempt=0;attempt<2&&!completionSaved;attempt++){
            try{
              await rpc('mg_complete_revision',{p_revision_id:revisionId,p_completion_test_id:S.testId});
              completionSaved=true;
            }catch(e){lastCompletionError=e;}
          }
          if(!completionSaved) console.error('Revision completion persistence failed:',lastCompletionError);
        }
      }
      const phase=completed===1?'First Attempt':completed===2?'Revision 1':completed===3?'Revision 2':completed===4?'Revision 3':'Unknown';
      history.push({phase,date:S.date,score:correct,total:25,attempted,times:S.qTimes.slice(),question_ids:(S.pool||[]).map(i=>QUESTIONS[i][4].question_id),answers:S.ans.slice(),marked:S.mark.slice()});
      let patch={completed,lastScore:correct,first:r.first||S.date,history,lastTestId:result?.id||r.lastTestId||null};if(completed===2)patch.r1_done=true;if(completed===3)patch.r2_done=true;if(completed>=4)patch.r3_done=true;setRec(S.set,patch);
      $('modal').innerHTML=resultModal();S.submitBusy=false;bind();return;
    }catch(e){console.error(e);S.submitBusy=false;submitBtns.forEach(b=>{b.disabled=false;b.textContent='Submit Test'});alert('Test submission failed: '+e.message);return;}
  }
  let r=rec(S.set),total=S.bookmarkMode?S.bookmarkItems.length:25;let correct=S.ans.reduce((n,a,i)=>{let qi=S.bookmarkMode?S.bookmarkItems[i].q:S.pool[i];return n+(a===QUESTIONS[qi][2]?1:0)},0);
  if(S.bookmarkMode){$('modal').innerHTML=`<div class="modal"><div class="modalbox glass"><h2>Bookmarked Test Submitted</h2><p class="muted">Score: ${correct}/${total}</p><button class="btn primary" id="homeAfterBookmark" style="width:100%">Back to Home</button></div></div>`;S.submitBusy=false;bind();return}
  S.submitBusy=false;
}

function startTimer(reset=true){
  clearInterval(window.timer);
  if(reset || !Number.isFinite(S.deadline) || S.deadline<=Date.now()){
    S.deadline=Date.now()+900000;
    S.seconds=900;
    S.lastTwoMinuteNotice=false;
  }else{
    S.seconds=Math.max(0,Math.ceil((S.deadline-Date.now())/1000));
  }
  const tick=()=>{
    let remaining=Math.max(0,S.deadline-Date.now());
    S.seconds=Math.ceil(remaining/1000);
    let e=$("timer");
    if(e){e.textContent=fmt(S.seconds);e.classList.toggle("low",S.seconds<=120)}
    // Persistence is handled by a lightweight 5-second heartbeat below;
    // do not serialize the full test state on every timer tick.
    if(remaining<=120000 && remaining>0 && !S.lastTwoMinuteNotice){
      S.lastTwoMinuteNotice=true;
      $("modal").innerHTML=`<div class="modal"><div class="modalbox glass"><h2>Last Two Minutes Remaining</h2><p class="muted">Please review your answers and submit the test before the timer reaches 00:00.</p><button class="btn primary" id="closeLastTwo" style="width:100%">Continue Test</button></div></div>`;
      $("closeLastTwo")?.addEventListener("click",()=>{$("modal").innerHTML=""});
    }
    if(remaining<=0){
      clearInterval(window.timer);
      if(!S.autoSubmitting){S.autoSubmitting=true;submitNow(true)}
    }
  };
  tick();
  window.timer=setInterval(tick,1000);
}

async function boot(){
  try{
    await loadMGDatabase();
    const session=await ensureSupabaseSession();
    const forcedLogout=localStorage.getItem(LOGOUT_KEY)==="1";
    if(session?.user?.id) localStorage.removeItem(LOGOUT_KEY);
    if(forcedLogout&&!session){
      try{await supabaseClient.auth.signOut()}catch(e){console.warn("Forced logout cleanup skipped:",e.message)}
      S.user="";S.name="";S.pin="";S.screen="login";
      return render(login());
    }
    let saved=account();
    const oauthCallback=/(^|[#?&])(access_token|refresh_token|code)=/.test(window.location.hash+window.location.search) || localStorage.getItem("SSC_GOOGLE_OAUTH_PENDING")==="1";
    if(session && oauthCallback && (session.user.app_metadata?.provider==="google" || session.user.identities?.some(i=>i.provider==="google"))){
      localStorage.removeItem("SSC_GOOGLE_OAUTH_PENDING");
      const {data:existingProfile}=await supabaseClient.from("ssc_profiles").select("id,user_code,display_name").eq("id",session.user.id).maybeSingle();
      if(existingProfile?.id){
        S.user=existingProfile.user_code;S.name=existingProfile.display_name||"";
        S.pin="";S.authUid=session.user.id;S.accountType="google";S.googleEmail=String(session.user.email||"");
        saveAccount();
        S.googleOnboarding=false;S.googlePinLogin=true;S.authMode="signin";
        return render(login());
      }
      S.googleOnboarding=true;S.googlePinLogin=false;S.authMode="signup";
      S.user="";S.name="";
      S.pin="";S.authUid=session.user.id;S.accountType="google";S.googleEmail=String(session.user.email||"");
      return render(login());
    }
    if(saved && session && saved.authUid && saved.authUid!==session.user.id){
      try{await supabaseClient.auth.signOut()}catch(e){console.warn("Mismatched session cleanup skipped:",e.message)}
      return alert("The saved account and current authentication session do not match. Please sign in with the correct method.");
    }
    if(saved && session){
      S.user=saved.user;S.name=saved.name||"";S.pin="";S.authUid=session.user.id;S.accountType=saved.accountType||"pin";S.googleEmail=saved.googleEmail||"";
      try{await loadRemoteBookmarks();}catch(e){console.warn('Remote bookmark preload skipped:',e.message)}
      showSplash(()=>{
        const lv=getLastView();
        if(lv&&lv.screen==='test'&&Number.isInteger(lv.set)&&Number.isInteger(lv.q)){
          S.set=lv.set;S.q=lv.q;S.bookmarkMode=!!lv.bookmarkMode;S.ans=lv.ans||blankArr();S.mark=lv.mark||blankBool();S.state=lv.state||blankState();S.date=lv.date||todayISO();S.phase=lv.phase||'first';S.pool=lv.pool||[];S.bookmarkItems=lv.bookmarkItems||[];S.qTimes=lv.qTimes||blankArr().map(()=>0);S.qStartAt=Date.now();S.paletteVisible=!isTouchDevice();S.seconds=Math.max(0,Number(lv.remaining)||0);S.deadline=S.bookmarkMode?0:Date.now()+S.seconds*1000;S.autoSubmitting=false;S.screen='test';render(test());if(!S.bookmarkMode)startTimer(false);
        }else if(lv&&lv.screen==='solutions'&&Number.isInteger(lv.set)&&Number.isInteger(lv.q)){
          S.set=lv.set;S.q=lv.q;S.bookmarkMode=!!lv.bookmarkMode;S.ans=lv.ans||blankArr();S.mark=lv.mark||blankBool();S.state=lv.state||blankState();S.qTimes=lv.qTimes||blankArr().map(()=>0);S.bookmarkItems=lv.bookmarkItems||[];S.pool=lv.pool||[];S.screen='solutions';render(solutions());
        }else if(lv&&lv.screen==='bookmarked'){
          S.screen='bookmarked';render(bookmarkedView());
        }else render(home());
      });
    }else { S.authMode=account()?"signin":"signup"; render(login()); }
  }catch(err){
    document.getElementById("app").innerHTML='<main class="login"><section class="card glass auth"><div class="tag">DATABASE ERROR</div><h1>Database could not be loaded</h1><p class="muted">Check the Supabase connection and ensure the required MG 125 tables/RPCs are deployed.</p></section></main>';
    console.error('SSC Archives boot failed:', err?.message||err);
  }
}
/* V45: smooth Android portrait/landscape changes without forcing orientation */
(function bindOrientationSmoothing(){
  if(!('matchMedia' in window)) return;
  const isAndroid=()=>/Android/i.test(navigator.userAgent||'');
  if(!isAndroid()) return;
  let timer=null;
  const smooth=()=>{
    document.body.classList.add('orientation-changing');
    clearTimeout(timer);
    timer=setTimeout(()=>document.body.classList.remove('orientation-changing'),260);
  };
  window.addEventListener('orientationchange',smooth,{passive:true});
  window.addEventListener('resize',()=>{
    clearTimeout(timer);
    timer=setTimeout(()=>{
      if(document.body.classList.contains('orientation-changing')) document.body.classList.remove('orientation-changing');
    },260);
  },{passive:true});
})();
