<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef5ff">
<title>SSC Archives — Maths (Geometry) Dummy Test V6</title>
<style>
:root{--bg:#f3f7fc;--card:rgba(255,255,255,.78);--solid:#fff;--ink:#12213b;--muted:#667790;--line:rgba(104,135,174,.22);--blue:#1769e0;--cyan:#09a7d7;--green:#18a957;--orange:#f59e0b;--red:#e5484d;--shadow:0 18px 55px rgba(28,58,94,.11);--qsize:20px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
body{background:radial-gradient(circle at 5% 0%,#dcecff,transparent 32%),radial-gradient(circle at 100% 10%,#e4f8ff,transparent 30%),linear-gradient(135deg,var(--bg),#fbfdff)}
button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.glass{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.82);border-bottom:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.topin{max-width:1220px;margin:auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;font-size:24px;letter-spacing:-1px}.brand span{color:var(--blue)}.tag{font-size:9px;letter-spacing:1.7px;color:var(--muted)}
.wrap{max-width:1220px;margin:auto;padding:22px}.card{border-radius:20px;padding:20px}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.88);color:var(--ink);padding:10px 14px;border-radius:11px;font-weight:760}.btn.primary{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;border:0}.btn.danger{background:#fff0f0;color:var(--red)}.btn.warn{background:#fff8e8;color:#9a6500}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:var(--muted)}.small{font-size:12px}
h1{font-size:42px;line-height:1.04;letter-spacing:-1.5px;margin:7px 0 15px}h2{margin:0 0 10px}
.notice{padding:13px 15px;border-radius:12px;background:rgba(239,247,255,.9);border:1px solid #d7e8fa}
.notice.due{border-color:#f3c36a;background:#fff9ec}.notice.ok{border-color:#a9dfbf;background:#f1fbf5}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.auth{width:min(470px,100%)}.field{display:grid;gap:6px;margin:13px 0}.field label{font-weight:750;font-size:13px}.field input,.field select{padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
.google{width:100%;margin-top:10px;background:#fff;border:1px solid var(--line)}
.homegrid{display:grid;grid-template-columns:1fr 1.8fr;gap:18px}.sets{display:grid;gap:10px;margin-top:15px}.set{width:100%;text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.8);border-radius:12px;padding:15px}.set small{display:block;color:var(--muted);margin-top:3px}.set:hover{border-color:#75aef2}.set .row{justify-content:space-between}
.notifs{display:grid;gap:9px;margin:12px 0 18px}.notif{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff}.notif b{color:var(--red)}
.test{display:grid;grid-template-columns:1fr 260px;gap:16px}.palette-card{order:2}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.qnum{padding:9px 5px;border:1px solid var(--line);border-radius:8px;background:#fff}.qnum.current{outline:3px solid rgba(23,105,224,.28);outline-offset:1px}.qnum.green{border-color:var(--green);background:#dff7e8;color:#08753a}.qnum.purple{border-color:#7c3aed;background:#eee7ff;color:#5b21b6}.qnum.yellow{border-color:#eab308;background:#fff7c2;color:#8a6500}.qnum.red{border-color:var(--red);background:#ffe3e3;color:#a51d22}.qnum{font-weight:800}.legend{font-weight:750}.green-dot{color:#08753a}.purple-dot{color:#5b21b6}.yellow-dot{color:#8a6500}.red-dot{color:#a51d22}.palette-hidden{grid-template-columns:1fr!important}.palette-card{transition:none}
.palette-head{display:flex;justify-content:space-between;align-items:center}.question{font-size:var(--qsize);font-weight:720;line-height:1.55;margin:18px 0}.option{display:block;width:100%;text-align:left;padding:13px;margin:10px 0;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.86);color:var(--ink);font-size:calc(var(--qsize) - 2px)}.option.selected{border:2px solid var(--blue);background:#eff6ff}.option b{display:inline-grid;place-items:center;width:30px;height:30px;border:1px solid #b8c9df;border-radius:50%;margin-right:8px}
.testbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.timer{font-variant-numeric:tabular-nums;font-size:22px;font-weight:900;color:var(--blue)}.timer.low{color:var(--red)}
.actions{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:20px}.right{display:flex;gap:8px;flex-wrap:wrap}.bookmark{font-size:12px}
.progress{height:8px;background:#e8eef6;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:99px}
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:18px;background:rgba(17,35,60,.28);backdrop-filter:blur(9px)}.modalbox{width:min(470px,100%);border-radius:22px;padding:23px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{font-size:27px;font-weight:900}.solution{padding:17px;border-radius:12px;background:#f4f9ff;border:1px solid #d7e8fa;font-size:calc(var(--qsize) - 2px);line-height:1.6}
.sizebar{display:flex;gap:5px;align-items:center}.sizebar .btn{padding:7px 9px;font-size:12px}.sizebar .active{border-color:var(--blue);background:#eff6ff}
@media(max-width:900px){.homegrid,.test{grid-template-columns:1fr}.palette-card{order:0}.test.palette-hidden{grid-template-columns:1fr}}
@media(max-width:600px){.wrap{padding:12px}.topin{padding:10px 12px}.tag{display:none}.brand{font-size:21px}.card{padding:15px;border-radius:16px}h1{font-size:32px}.testbar{align-items:flex-start}.timer{font-size:20px}.actions{position:sticky;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);margin:15px -15px -15px;padding:12px 15px;z-index:10}.actions .btn{padding:10px 11px;font-size:12px}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><div id="app"></div><div id="modal"></div>
<script>
const SETS=[1,2,3,4,5];
const QUESTIONS=[
["In a triangle, two angles are 50° and 60°. What is the third angle?",["40°","50°","60°","70°"],3,"The angles of a triangle add to 180°. Therefore, 180° − 50° − 60° = 70°."],
["The sum of the interior angles of a quadrilateral is:",["180°","270°","360°","540°"],2,"A quadrilateral can be divided into two triangles, so the sum is 360°."],
["A right angle measures:",["45°","60°","90°","120°"],2,"A right angle measures 90°."],
["If two parallel lines are cut by a transversal, corresponding angles are:",["Equal","Always supplementary","Always 45°","Always 90°"],0,"Corresponding angles are equal when the lines are parallel."],
["The perimeter of a square of side 7 cm is:",["14 cm","21 cm","28 cm","49 cm"],2,"Perimeter = 4 × 7 = 28 cm."],
["The area of a square of side 8 cm is:",["16 cm²","32 cm²","64 cm²","128 cm²"],2,"Area = 8² = 64 cm²."],
["A triangle with all three sides equal is called:",["Scalene","Isosceles","Equilateral","Right"],2,"An equilateral triangle has three equal sides."],
["A triangle with two equal sides is called:",["Scalene","Isosceles","Equilateral","Obtuse"],1,"An isosceles triangle has two equal sides."],
["An angle greater than 90° but less than 180° is:",["Acute","Right","Obtuse","Reflex"],2,"An obtuse angle is greater than 90° and less than 180°."],
["An angle less than 90° is:",["Acute","Right","Obtuse","Straight"],0,"An acute angle is less than 90°."],
["A straight angle measures:",["90°","180°","270°","360°"],1,"A straight angle measures 180°."],
["A full angle measures:",["90°","180°","270°","360°"],3,"One complete turn is 360°."],
["The diagonals of a rectangle are:",["Always unequal","Equal","Perpendicular always","Parallel"],1,"The diagonals of a rectangle are equal in length."],
["The diagonals of a square are:",["Equal","Unequal","Only parallel","Never intersecting"],0,"The diagonals of a square are equal."],
["The distance from the centre of a circle to its circumference is:",["Diameter","Radius","Chord","Arc"],1,"The radius joins the centre to a point on the circle."],
["The diameter of a circle is twice its:",["Area","Circumference","Radius","Chord"],2,"Diameter = 2 × radius."],
["A line segment joining two points on a circle is a:",["Radius","Diameter only","Chord","Tangent"],2,"A chord joins any two points on a circle."],
["A tangent to a circle touches it at:",["Two points","One point","Three points","No point"],1,"A tangent touches a circle at exactly one point."],
["The angle in a semicircle is:",["45°","60°","90°","180°"],2,"The angle subtended by a diameter at the circumference is 90°."],
["If the radius of a circle is 5 cm, its diameter is:",["2.5 cm","5 cm","10 cm","25 cm"],2,"Diameter = 2 × 5 = 10 cm."],
["The area of a triangle with base 10 cm and height 6 cm is:",["16 cm²","30 cm²","60 cm²","120 cm²"],1,"Area = 1/2 × 10 × 6 = 30 cm²."],
["The perimeter of a rectangle 9 cm by 4 cm is:",["13 cm","26 cm","36 cm","72 cm"],1,"Perimeter = 2(9 + 4) = 26 cm."],
["A polygon with 5 sides is called:",["Quadrilateral","Pentagon","Hexagon","Octagon"],1,"A five-sided polygon is a pentagon."],
["A polygon with 6 sides is called:",["Pentagon","Hexagon","Heptagon","Octagon"],1,"A six-sided polygon is a hexagon."],
["The sum of the angles of a triangle is:",["90°","180°","270°","360°"],1,"The interior angles of every triangle add to 180°."]
];
const KEY="ssc_archives_account_v4";
const DATA_KEY="ssc_archives_data_v4";
const $=id=>document.getElementById(id);
const blankArr=()=>Array(25).fill(null);
const blankBool=()=>Array(25).fill(false);
const blankState=()=>Array(25).fill("new");
const defaultData=()=>({attempts:{},bookmarks:[],sizeStep:0});
let D=loadData(), S={screen:"login",user:"",pin:"",set:1,q:0,ans:blankArr(),mark:blankBool(),date:"",seconds:900,phase:"first",bookmarkMode:false,bookmarkItems:[],state:blankState(),paletteVisible:true};
function account(){try{return JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){return null}}
function saveAccount(){localStorage.setItem(KEY,JSON.stringify({user:S.user,pin:S.pin}))}
function loadData(){try{return Object.assign(defaultData(),JSON.parse(localStorage.getItem(DATA_KEY)||"{}"))}catch(e){return defaultData()}}
function saveData(){localStorage.setItem(DATA_KEY,JSON.stringify(D))}
function setKey(set){return "set"+set}
function rec(set){return D.attempts[setKey(set)]||{first:null,r1:null,r2:null,r3:null,completed:0,lastScore:null}}
function setRec(set,patch){D.attempts[setKey(set)]=Object.assign(rec(set),patch);saveData()}
function resetTest(){S.q=0;S.ans=blankArr();S.mark=blankBool();S.state=blankState();S.paletteVisible=true;S.seconds=900}
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function sizePx(){return [16,18,20,22,24][D.sizeStep+2]}
function applySize(){document.documentElement.style.setProperty("--qsize",sizePx()+"px")}
function sizeButtons(){return `<div class="sizebar"><span class="small muted">Text</span>${[-2,-1,0,1,2].map(n=>`<button class="btn ${D.sizeStep===n?"active":""}" data-size="${n}">${n===0?"Current":n<0?"−"+Math.abs(n):"＋"+n}</button>`).join("")}</div>`}
function bindSize(){document.querySelectorAll("[data-size]").forEach(b=>b.onclick=()=>{D.sizeStep=+b.dataset.size;saveData();applySize();render(S.screen==="test"?test():S.screen==="solutions"?solutions():home())})}
function authHeading(){return account()?"Welcome Back":"Welcome"}
function login(){
return `<main class="login"><section class="card glass auth">
<div class="brand">SSC <span>Archives</span></div><div class="tag">PRACTICE TODAY · HIGHER TOMORROW</div>
<h1>${authHeading()}</h1><p class="muted">${account()?"Login to continue your practice.":"Create your account to start your journey."}</p>
<div class="field"><label>User ID</label><input id="uid" placeholder="Alphanumeric User ID"></div>
<div class="field"><label>PIN</label><input id="pin" inputmode="numeric" maxlength="6" placeholder="4 or 6 digits"></div>
<button class="btn primary" id="login" style="width:100%">${account()?"Login":"Create Account"}</button>
<button class="btn google" id="google">Continue with Google <span class="small muted">(Coming Soon)</span></button>
<p class="small muted">Google is disabled for local testing and will not import Google profile data.</p>
</section></main>`;
}
function notifications(){
let items=[];
SETS.forEach(set=>{let r=rec(set);["r1","r2","r3"].forEach((k,i)=>{if(r[k]&&!r[k+"_done"]){let due=new Date(r[k]+"T00:00:00"),today=new Date();today.setHours(0,0,0,0);let diff=Math.round((due-today)/86400000);if(diff<=0)items.push({set,k,idx:i+1,text:diff===0?`Your Maths (Geometry) — Set ${set} Revision ${i+1} is due today.`:`Your Maths (Geometry) — Set ${set} Revision ${i+1} is overdue.`})}})});
return items;
}
function home(){
let ns=notifications(), bcount=D.bookmarks.length;
return `<header class="top"><div class="topin"><div><div class="brand">SSC <span>Archives</span></div><div class="tag">PRACTICE TODAY · HIGHER TOMORROW</div></div><div class="row"><span class="small muted">${S.user}</span><button class="btn" id="signout">Sign Out</button></div></div></header>
<main class="wrap">
${ns.length?`<section class="card glass"><div class="row between"><h2>🔔 Notifications</h2><span class="small muted">${ns.length} due</span></div><div class="notifs">${ns.map(n=>`<div class="notif">🔔 <b>${n.text}</b> <span class="small muted">Open Set ${n.set} to revise.</span></div>`).join("")}</div></section>`:""}
<section class="card glass" style="margin-top:18px"><div class="row between"><div><div class="tag">MATHS · GEOMETRY</div><h1>Practice Tests</h1><p class="muted">5 Sets · 25 questions each · 125-question structure.</p></div><button class="btn" id="bookmarks">Bookmarked Questions (${bcount})</button></div>
<div class="field" style="max-width:300px"><label>Language</label><select id="lang"><option>English</option><option>Hindi</option></select></div>
<div class="sets">${SETS.map(set=>{let r=rec(set);return `<button class="set" data-set="${set}"><div class="row"><div><b>Set ${set}</b><small>25 Questions · ${r.completed?"Attempted":"Not Attempted"}</small></div><b class="btn primary">${r.completed?"Attempt Again":"Start Test"}</b></div></button>`}).join("")}</div></section>
<section class="card glass" style="margin-top:18px"><h2>Text Size</h2><p class="small muted">Choose up to two sizes smaller or two sizes larger than the current default.</p>${sizeButtons()}</section>
</main>`;
}
function paletteClass(i){
  let cls="";
  if(S.mark[i] && S.ans[i]!==null) cls+=" purple";
  else if(S.mark[i] && S.ans[i]===null) cls+=" yellow";
  else if(S.ans[i]!==null) cls+=" green";
  else if(S.state[i]==="saved") cls+=" red";
  if(i===S.q) cls+=" current";
  return cls;
}
function test(){
let item=activeItem(), q=QUESTIONS[item.q], total=S.bookmarkMode?S.bookmarkItems.length:25;
let title=S.bookmarkMode?"Bookmarked Questions":`Maths (Geometry) — Set ${S.set}`;
let palette=S.paletteVisible;
return `<header class="top"><div class="topin"><button class="btn" id="back">← Back</button><div class="brand">SSC <span>Archives</span></div><div class="row">${sizeButtons()}<button class="btn" id="paletteToggle">${palette?"Hide Palette":"Question Palette"}</button><div class="timer ${S.seconds<=60?"low":""}" id="timer">${fmt(S.seconds)}</div><button class="btn danger" id="submit">Submit Test</button></div></div></header>
<main class="wrap"><div class="test ${palette?"":"palette-hidden"}"><section class="card glass"><div class="testbar"><div><b>${title}</b><div class="small muted">${S.bookmarkMode?"Saved questions only":"English · Question "+(S.q+1)+" / 25"} · Test Date: ${S.date}</div></div><span class="small muted">${S.ans.filter(x=>x!==null).length}/${total} Answered</span></div>
<div class="progress"><i style="width:${((S.q+1)/total)*100}%"></i></div>
<div class="row between"><span class="small muted">Question ${S.q+1} / ${total}${S.bookmarkMode?` · Set ${item.set}`:""}</span><button class="btn bookmark" id="bookmark">${isBookmarked(item.set,item.q)?"★ Bookmarked":"☆ Bookmark"}</button></div>
<div class="question">Q${item.q+1}. ${q[0]}</div>
${q[1].map((o,i)=>`<button class="option ${S.ans[S.q]===i?"selected":""}" data-opt="${i}"><b>${String.fromCharCode(65+i)}</b>${o}</button>`).join("")}
<div class="actions"><button class="btn" id="prev">← Previous</button><div class="right"><button class="btn" id="clear">Clear Response</button><button class="btn warn" id="mark">${S.mark[S.q]?"★ Marked":"☆ Mark for Review"}</button><button class="btn" id="save">Save & Next</button><button class="btn primary" id="next">Next →</button></div></div>
</section>
<aside class="card glass palette-card ${palette?"":"hidden"}" id="paletteCard"><div class="palette-head"><b>Question Palette</b><button class="btn" id="collapse">Hide</button></div><div id="paletteBody"><p class="small muted"><span class="legend green-dot">Answered</span> · <span class="legend purple-dot">Answered + Marked</span> · <span class="legend yellow-dot">Marked, Not Answered</span> · <span class="legend red-dot">Skipped / Saved, Not Answered</span></p><div class="palette">${Array.from({length:total},(_,i)=>`<button class="qnum${paletteClass(i)}" data-q="${i}">${i+1}</button>`).join("")}</div><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><button class="btn danger" id="lastSubmit" style="width:100%">Submit Test</button></div></aside></div></main>`;
}
function startModal(){
let r=rec(S.set), stage=r.completed===0?"First Attempt":(r.completed<=3?`Revision ${r.completed}`:"Practice Re-attempt");
return `<div class="modal"><div class="modalbox glass"><h2>Start Test — Set ${S.set}</h2><p>Maths (Geometry) · English · ${stage}</p><div class="field"><label>Test Date</label><input id="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="notice small">This date is saved for this ${stage.toLowerCase()}.</div><br><div class="row"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="go">Start Test</button></div></div></div>`;
}
function resultModal(){
let total=S.bookmarkMode?S.bookmarkItems.length:25;
let attempted=S.ans.filter(x=>x!==null).length,correct=S.ans.reduce((n,a,i)=>{let qi=S.bookmarkMode?S.bookmarkItems[i].q:i;return n+(a===QUESTIONS[qi][2]?1:0)},0);
return `<div class="modal"><div class="modalbox glass"><h2>✓ Test Submitted</h2><p class="muted">Maths (Geometry) — Set ${S.set}</p><div class="stats"><div><div class="stat">${correct}/${total}</div><small class="muted">Score</small></div><div><div class="stat">${correct}</div><small class="muted">Correct</small></div><div><div class="stat">${total-attempted}</div><small class="muted">Not Attempted</small></div></div><br><button class="btn primary" id="viewResult" style="width:100%">View Result</button></div></div>`;
}
function detailResult(){
let total=S.bookmarkMode?S.bookmarkItems.length:25;
let attempted=S.ans.filter(x=>x!==null).length,correct=S.ans.reduce((n,a,i)=>{let qi=S.bookmarkMode?S.bookmarkItems[i].q:i;return n+(a===QUESTIONS[qi][2]?1:0)},0),r=rec(S.set);
let next=r.completed===1?"Revision 1":r.completed===2?"Revision 2":r.completed===3?"Revision 3":null;
return `<div class="modal"><div class="modalbox glass"><h2>Test Result — Set ${S.set}</h2><div class="stats"><div><div class="stat">${correct}/25</div><small class="muted">Score</small></div><div><div class="stat">${attempted-correct}</div><small class="muted">Incorrect</small></div><div><div class="stat">${total-attempted}</div><small class="muted">Not Attempted</small></div></div><p class="muted small">${next?`Next: set ${next} date before opening solutions.`:"Revision cycle complete."}</p>${next?`<button class="btn primary" id="revision" style="width:100%">Set ${next} Date</button>`:""}<br><button class="btn" id="openSolutions" style="width:100%;margin-top:8px">Open Solutions</button></div></div>`;
}
function revisionModal(){
let r=rec(S.set), n=r.completed===1?1:r.completed===2?2:r.completed===3?3:null;
if(!n)return `<div class="modal"><div class="modalbox glass"><h2>Revision Cycle Complete</h2><p class="muted">All three revision stages are complete for Set ${S.set}.</p><button class="btn primary" id="openSolutions" style="width:100%">Open Solutions</button></div></div>`;
return `<div class="modal"><div class="modalbox glass"><h2>Set Revision ${n} Date</h2><p class="muted">Only the next revision date is requested now. Later dates will be requested after the corresponding revision is completed.</p><div class="field"><label>Revision ${n} Date</label><input id="revDate" type="date"></div><div class="row"><button class="btn" id="skip">Skip for Now</button><button class="btn primary" id="saveRev">Save & View Solutions</button></div></div></div>`;
}
function activeItem(){return S.bookmarkMode?S.bookmarkItems[S.q]:{set:S.set,q:S.q}}
function isBookmarked(set,q){return D.bookmarks.some(x=>x.set===set&&x.q===q)}
function toggleBookmark(){let item=activeItem();let i=D.bookmarks.findIndex(x=>x.set===item.set&&x.q===item.q);if(i>=0)D.bookmarks.splice(i,1);else D.bookmarks.push({set:item.set,q:item.q});saveData()}
function solutions(){
let item=activeItem();
let q=QUESTIONS[item.q];
return `<header class="top"><div class="topin"><button class="btn" id="solutionBack">← Back</button><div class="brand">SSC <span>Archives</span></div><div class="row">${sizeButtons()}<span class="small muted">Solutions · Set ${S.set}</span></div></div></header>
<main class="wrap"><section class="card glass"><div class="row between"><div><div class="tag">SOLUTION VIEW</div><h2>Maths (Geometry) — Set ${S.set}</h2></div><div class="row"><span class="small muted">Q${S.q+1}/${S.bookmarkMode?S.bookmarkItems.length:25}</span><button class="btn bookmark" id="bookmark">${isBookmarked(item.set,item.q)?"★ Bookmarked":"☆ Bookmark"}</button></div></div><div class="question">Q${S.q+1}. ${q[0]}</div>${q[1].map((o,i)=>`<div class="option ${i===q[2]?"selected":""}"><b>${String.fromCharCode(65+i)}</b>${o} ${i===q[2]?"✓":""}</div>`).join("")}<div class="solution"><b>Step-by-Step Explanation</b><br>${q[3]}</div><div class="actions"><button class="btn" id="sprev">← Previous</button><button class="btn primary" id="snext">Next Solution →</button></div></section></main>`;
}
function bookmarkedView(){
let items=D.bookmarks;
return `<header class="top"><div class="topin"><button class="btn" id="homeBack">← Home</button><div class="brand">SSC <span>Archives</span></div></div></header><main class="wrap"><section class="card glass"><h2>Bookmarked Questions</h2><p class="muted">${items.length} saved question(s).</p>${items.length?items.map((x,i)=>`<button class="set" data-bset="${x.set}" data-bq="${x.q}" style="margin:6px 0"><div><b>Set ${x.set} · Question ${x.q+1}</b><small>${QUESTIONS[x.q][0]}</small></div></button>`).join(""):`<div class="notice">No bookmarked questions yet.</div>`}<br>${items.length?`<button class="btn primary" id="attemptBookmarks">Attempt Bookmarked Questions</button>`:""}</section></main>`;
}
function render(content){
  $("app").innerHTML = content;
  bind();
}

function bind(){
applySize();bindSize();
$("login")?.addEventListener("click",()=>{
let u=$("uid").value.trim(),p=$("pin").value.trim(),a=account();
if(!/^[A-Za-z0-9_-]{4,30}$/.test(u))return alert("User ID: use 4–30 letters, numbers, _ or -.");
if(!/^(\d{4}|\d{6})$/.test(p))return alert("PIN must be exactly 4 or 6 digits.");
if(a&&a.user!==u)return alert("Use the registered User ID for this demo account.");
S.user=u;S.pin=p;saveAccount();render(home());
});
$("google")?.addEventListener("click",()=>alert("Google authentication is disabled during local testing."));
$("signout")?.addEventListener("click",()=>{S.unlocked=false;render(login())});
$("lang")?.addEventListener("change",e=>alert(e.target.value+" question content will be loaded when the real dataset is connected."));
document.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>{S.set=+b.dataset.set;$("modal").innerHTML=startModal();bindModal()});
$("bookmarks")?.addEventListener("click",()=>{S.screen="bookmarked";render(bookmarkedView())});
$("homeBack")?.addEventListener("click",()=>{S.screen="home";render(home())});
document.querySelectorAll("[data-bset]").forEach(b=>b.onclick=()=>{S.set=+b.dataset.bset;S.q=+b.dataset.bq;S.screen="solutions";render(solutions())});
$("attemptBookmarks")?.addEventListener("click",()=>{if(D.bookmarks.length){S.bookmarkMode=true;S.bookmarkItems=[...D.bookmarks];S.q=0;S.ans=Array(S.bookmarkItems.length).fill(null);S.mark=Array(S.bookmarkItems.length).fill(false);S.state=Array(S.bookmarkItems.length).fill("new");S.paletteVisible=true;S.date=new Date().toISOString().slice(0,10);S.seconds=900;S.screen="test";render(test());startTimer()}});
$("back")?.addEventListener("click",()=>{clearInterval(window.timer);S.bookmarkMode=false;S.screen="home";render(home())});
$("paletteToggle")?.addEventListener("click",()=>{S.paletteVisible=!S.paletteVisible;render(test())});
$("collapse")?.addEventListener("click",()=>{S.paletteVisible=false;render(test())});
document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{S.q=+b.dataset.q;S.paletteVisible=false;render(test())});
document.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{S.ans[S.q]=+b.dataset.opt;S.state[S.q]="answered";render(test())});
$("bookmark")?.addEventListener("click",()=>{toggleBookmark();render(S.screen==="solutions"?solutions():test())});
$("mark")?.addEventListener("click",()=>{S.mark[S.q]=!S.mark[S.q];if(S.mark[S.q] && S.ans[S.q]===null)S.state[S.q]="marked";render(test())});
$("clear")?.addEventListener("click",()=>{S.ans[S.q]=null;if(S.mark[S.q])S.state[S.q]="marked";else if(S.state[S.q]==="answered")S.state[S.q]="visited";render(test())});
$("prev")?.addEventListener("click",()=>{if(S.q>0){S.q--;S.paletteVisible=false;render(test())}});
let totalQ=S.bookmarkMode?S.bookmarkItems.length:25;
$("next")?.addEventListener("click",()=>{if(S.q<totalQ-1){if(S.ans[S.q]===null && !S.mark[S.q])S.state[S.q]="visited";S.q++;S.paletteVisible=false;render(test())}});
$("save")?.addEventListener("click",()=>{if(S.q<totalQ-1){if(S.ans[S.q]===null)S.state[S.q]="saved";else S.state[S.q]="answered";S.q++;S.paletteVisible=false;render(test())}});
$("submit")?.addEventListener("click",submitNow);$("lastSubmit")?.addEventListener("click",submitNow);
$("viewResult")?.addEventListener("click",()=>{$("modal").innerHTML=detailResult();bind()});
$("revision")?.addEventListener("click",()=>{$("modal").innerHTML=revisionModal();bindRevision()});
$("openSolutions")?.addEventListener("click",()=>{$("modal").innerHTML="";S.bookmarkMode=false;S.q=0;S.screen="solutions";render(solutions())});
$("homeAfterBookmark")?.addEventListener("click",()=>{$("modal").innerHTML="";S.bookmarkMode=false;S.screen="home";render(home())});
$("solutionBack")?.addEventListener("click",()=>{S.screen="home";render(home())});
$("sprev")?.addEventListener("click",()=>{if(S.q>0){S.q--;render(solutions())}});
$("snext")?.addEventListener("click",()=>{let total=S.bookmarkMode?S.bookmarkItems.length:25;if(S.q<total-1){S.q++;render(solutions())}});
}
function bindModal(){
$("cancel").onclick=()=>$("modal").innerHTML="";
$("go").onclick=()=>{S.date=$("date").value;if(!S.date)return alert("Please select a Test Date.");resetTest();S.screen="test";$("modal").innerHTML="";render(test());startTimer()}
}
function bindRevision(){
$("skip").onclick=()=>{$("modal").innerHTML="";S.screen="solutions";render(solutions())};
$("saveRev").onclick=()=>{let r=rec(S.set),n=r.completed===1?1:r.completed===2?2:r.completed===3?3:null;if(!n)return;let d=$("revDate").value;if(!d)return alert("Please select a revision date.");setRec(S.set,{["r"+n]:d});$("modal").innerHTML="";S.screen="solutions";render(solutions())}
}
function submitNow(){clearInterval(window.timer);let r=rec(S.set);
let total=S.bookmarkMode?S.bookmarkItems.length:25;
let correct=S.ans.reduce((n,a,i)=>{let qi=S.bookmarkMode?S.bookmarkItems[i].q:i;return n+(a===QUESTIONS[qi][2]?1:0)},0);
if(S.bookmarkMode){$("modal").innerHTML=`<div class="modal"><div class="modalbox glass"><h2>Bookmarked Test Submitted</h2><p class="muted">Score: ${correct}/${total}</p><button class="btn primary" id="homeAfterBookmark" style="width:100%">Back to Home</button></div></div>`;bind();return}
let completed=(r.completed||0)+1;setRec(S.set,{completed,lastScore:correct,first:r.first||S.date});if(completed===1)setRec(S.set,{first:S.date});if(completed===2)setRec(S.set,{r1_done:true});if(completed===3)setRec(S.set,{r2_done:true});if(completed>=4)setRec(S.set,{r3_done:true});$("modal").innerHTML=resultModal();bind()}
function startTimer(){clearInterval(window.timer);window.timer=setInterval(()=>{S.seconds--;let e=$("timer");if(e){e.textContent=fmt(S.seconds);e.classList.toggle("low",S.seconds<=60)}if(S.seconds<=0){clearInterval(window.timer);submitNow()}},1000)}
let saved=account();if(saved){S.user=saved.user;S.pin=saved.pin;render(home())}else render(login());
</script>
</body></html>
